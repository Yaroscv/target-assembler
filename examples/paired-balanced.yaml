project:
  name: Heracleum_5S
  mode: all
  outdir: results_5S
  temp_dir: null  # Set to a roomy filesystem for large libraries, e.g. /mnt/d/target_tmp

input:
  reads1: sample_R1.fastq.gz
  reads2: sample_R2.fastq.gz
  layout: paired
  hmm: 5S_profile.hmm

runtime:
  threads: 16
  seed: 42
  keep_work: false
  temp_space_check: true
  temp_space_margin_gb: 1.0

sampling:
  mode: adaptive
  micro_units: 500000
  target_hmm_hits: 1000
  minimum_units: 100000

assembly:
  technology: solexa
  rounds: 2
  mira_max_units: 30000
  insert_size_min: 150
  insert_size_max: 450

extraction:
  mode: tandem
  minimum_model_fraction: 0.90

validation:
  profile: balanced
  reference_mode: tandem
  # Any value from a profile can be overridden here, for example:
  # source: expanded
  # max_units: 300000
  # minimum_covered_percent: 75

proportion:
  enabled: true
  sample_units: 1000000
  replicates: 1
  report_metric: aligned_nt
  include_envelope_metric: true

outputs:
  save_intermediate_libraries: false
