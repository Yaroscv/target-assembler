project:
  name: high_quality_repeat
  mode: all
  outdir: results_strict
  temp_dir: null

input:
  reads1: sample_R1.fastq.gz
  reads2: sample_R2.fastq.gz
  layout: paired
  hmm: target_profile.hmm

runtime:
  threads: 16
  keep_work: false
  temp_space_check: true
  temp_space_margin_gb: 1.0

assembly:
  technology: solexa
  insert_size_min: 200
  insert_size_max: 400
  mira_max_units: 50000

selection:
  # nhmmer's default is -E 10; for a conserved rRNA profile that recruits across
  # kingdoms. A strict run should set a threshold measured on YOUR profile at read
  # length. -T and -E are mutually exclusive: hmm_score_min wins.
  hmm_score_min: null
  hmm_evalue: null

validation:
  profile: strict
  reference_mode: tandem
  source: clean
  # Set null or 0 only if you intentionally want to scan the full library.
  max_units: 1000000

proportion:
  enabled: true
  sample_units: 1000000
  replicates: 3

outputs:
  save_intermediate_libraries: false
